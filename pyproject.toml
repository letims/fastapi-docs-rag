[project]
name = "fastapi-docs-rag"
version = "0.1.0"
description = "Agentic RAG over the FastAPI docs: idempotent queue-based ingestion, hybrid retrieval, evals"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.4",
  "google-genai>=1.0",
  "httpx>=0.27",
  "langgraph>=1.2.14",
  "sentry-sdk>=2.72.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pgserver>=0.1.4",  # throwaway Postgres + pgvector for tests when Docker is not around
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app", "scripts", "evals"]
branch = true

[tool.coverage.report]
fail_under = 90            # THE GATE: `make test` / CI fail below this (line + branch)
show_missing = true
skip_covered = false   # HTML shows every file;
exclude_also = [
  "if __name__ == .__main__.:",   # CLI entry stubs
  "^\\s*\\.\\.\\.$",              # Protocol method bodies
  "raise AssertionError\\(.unreachable.\\)",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# `ruff format` owns line length for code. E501 would only flag long strings, comments and
# docstrings, which it cannot reflow; wrapping those by hand adds noise, not clarity.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Exploratory scripts: imports must follow the env setup, and short lambdas/names are fine.
"experiments/*" = ["E402", "E741", "E731", "B905", "B023"]
