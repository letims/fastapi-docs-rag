name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: docsrag, POSTGRES_PASSWORD: docsrag, POSTGRES_DB: docsrag }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U docsrag" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://docsrag:docsrag@localhost:5433/docsrag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked   # fails if uv.lock is out of date with pyproject.toml
      - name: Lint and format (same as the pre-commit hook)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests + coverage gate (fails under 90%)
        run: uv run pytest -q --cov --cov-report=term-missing --cov-report=html --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-html, path: htmlcov }
