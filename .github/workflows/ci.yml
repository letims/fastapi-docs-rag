name: ci
on: [push, pull_request]
permissions:
  contents: read   # lint + tests need nothing else
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: docsrag, POSTGRES_PASSWORD: docsrag, POSTGRES_DB: docsrag }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U docsrag" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://docsrag:docsrag@localhost:5433/docsrag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked   # fails if uv.lock is out of date with pyproject.toml
      - name: Lint and format (same as the pre-commit hook)
        run: uv run ruff check . && uv run ruff format --check .
      - name: JSON schemas (Claude settings, workflows, eval runs)
        run: make validate-json
      - name: Tests + coverage gate (fails under 90%)
        run: uv run pytest -q --cov --cov-report=term-missing --cov-report=html --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: coverage-html, path: htmlcov }
