name: claude
# Runs ONLY when someone writes @claude in an issue or PR comment: the one place Claude may commit,
# because the user asked for it explicitly. No triggers on push, PR open or issue assignment.
# Only users with write access can trigger it (action default);
# bots are not allowed. Claude config (.claude/, CLAUDE.md) is restored from the base branch on PRs,
# so a PR cannot loosen its own permissions.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write        # push a branch with the fix
  pull-requests: write   # open/update the PR, reply in review threads
  issues: write          # reply to the comment
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 1 }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked   # so the Stop hook and allowed test commands can run
      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}   # scoped by the permissions block above
          claude_args: >-
            --max-turns 8
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(uv run pytest *),Bash(uv run ruff *),Bash(make check),Bash(make lint),Bash(make fmt),Bash(git diff *),Bash(git status),Bash(gh pr view *),Bash(gh pr diff *)"
