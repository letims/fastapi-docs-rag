# Pinned so the network, volume and container names do not depend on the folder name.
name: fastapi-docs-rag

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docsrag
      POSTGRES_PASSWORD: docsrag
      POSTGRES_DB: docsrag
    ports:
      - "127.0.0.1:5433:5432"   # localhost only (default creds); 5433 so it never clashes with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsrag"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
