services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragnarok
      POSTGRES_PASSWORD: ragnarok
      POSTGRES_DB: ragnarok
    ports:
      - "5433:5432"   # 5433 on the host so it never clashes with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragnarok"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
